<style>
:root {
  /* 寺町 Personal：紺 × オーカー / アイボリー地 */
  --bg: #F5F3EF;
  --card: #FFFFFF;
  --ink: #1A2744;
  --ink2: #6B6F7D;
  --ink3: #9B9DA6;
  --accent: #1A2744;
  --accent2: #2A3A5C;
  --accent-bg: rgba(26,39,68,0.05);
  --gold: #C8A55A;
  --gold-ink: #8A6A20;
  --gold-bg: #F4EEE0;
  --rule: #DED9CF;
  --rule2: #ECE7DD;
  --shadow: none;
  --s5: #1A2744;
  --s4: #4A5D85;
  --s3: #B5B1A6;
  --s2: #C07A35;
  --s1: #9E3229;
  --pos: #2A6F55;
  --imp: #8A6A20;
  --r: 4px;
  --font: "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:20px;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:1rem;}
.wrap{max-width:1100px;margin:0 auto;padding:1.2rem 1rem 2.4rem;}
.hdr{padding:1.6rem 0 1rem;}
.hdr h1{font-size:1.55rem;font-weight:700;letter-spacing:-0.01em;color:var(--ink);text-wrap:balance;}
.hdr p{font-size:0.75rem;color:var(--ink2);margin-top:2px;}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--rule);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:10;padding-top:2px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:0.5rem 0.7rem;font-size:0.75rem;font-weight:500;color:var(--ink2);cursor:pointer;border:none;background:none;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;font-family:var(--font);}
.tab:hover{color:var(--ink);}
.tab.act{color:var(--accent);font-weight:700;border-bottom-color:var(--gold);}
.tab .badge{font-size:10px;color:var(--ink3);margin-left:2px;}
.pnl{display:none;padding:24px 0;}
.pnl.act{display:block;}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:2rem;}
.tiles.t4{grid-template-columns:repeat(4,1fr);}
.tile{background:var(--card);border-radius:var(--r);padding:0.9rem 1rem;border:1px solid var(--rule);border-top:3px solid var(--rule);}
.tile.key{border-top-color:var(--gold);}
.tile-v{font-size:1.9rem;font-weight:700;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
.tile-l{font-size:0.65rem;color:var(--ink2);margin-top:4px;letter-spacing:0.02em;}
.tile-sub{font-size:0.6rem;color:var(--ink3);margin-top:2px;}
.sec{margin-bottom:1.6rem;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:1rem 1.1rem;}
.sec-t{font-size:0.7rem;font-weight:700;color:var(--ink);margin-bottom:0.8rem;letter-spacing:0.08em;padding-bottom:0.5rem;border-bottom:1px solid var(--rule2);display:flex;align-items:center;gap:0.45rem;text-wrap:balance;}
.sec-t::before{content:"";width:3px;height:0.85rem;background:var(--gold);flex-shrink:0;}
.sat-bar{display:flex;height:26px;border-radius:4px;overflow:hidden;gap:2px;background:var(--card);}
.sat-seg{display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:600;color:#fff;min-width:2px;transition:width .3s;}
.sat-seg.c5{background:var(--s5);}.sat-seg.c4{background:var(--s4);}.sat-seg.c3{background:var(--s3);color:var(--ink);}
.sat-seg.c2{background:var(--s2);}.sat-seg.c1{background:var(--s1);}
.sat-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;}
.sat-li{display:flex;align-items:center;gap:5px;font-size:0.65rem;color:var(--ink2);}
.sat-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.hbar{margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.hbar-lb{width:9rem;text-align:right;font-size:0.7rem;color:var(--ink2);flex-shrink:0;line-height:1.3;}
.hbar-tr{flex:1;height:1.2rem;background:var(--rule2);border-radius:3px;overflow:hidden;position:relative;}
.hbar-fl{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease;}
.sec-gold .hbar-fl{background:var(--gold);}
.sec-gold .sec-t::before{background:var(--accent);}
.hbar-vl{font-size:0.7rem;color:var(--ink2);margin-left:8px;flex-shrink:0;font-variant-numeric:tabular-nums;min-width:2rem;}
.cmts{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.cmt-col h3{font-size:0.75rem;font-weight:600;color:var(--ink2);margin-bottom:0.5rem;display:flex;align-items:center;gap:6px;}
.cmt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cmt-dot.p{background:var(--pos);}.cmt-dot.i{background:var(--imp);}
.cmt-list{list-style:none;}
.cmt-item{font-size:0.75rem;line-height:1.8;padding:0.5rem 0;border-bottom:1px solid var(--rule2);color:var(--ink);text-wrap:pretty;}
.cmt-item:last-child{border-bottom:none;}
.cmt-list:not(.open) .cmt-item:nth-child(n+6){display:none;}
.cmt-more{font-size:0.65rem;color:var(--gold-ink);cursor:pointer;padding:0.3rem 0;border:none;background:none;font-family:var(--font);font-weight:600;}
.cmt-more:hover{text-decoration:underline;}
.cmt-empty{font-size:0.75rem;color:var(--ink3);padding:0.4rem 0;}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:4px 0;}
table.sum{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
table.sum th{font-size:0.6rem;font-weight:600;color:var(--ink3);text-align:left;padding:0.5rem 0.6rem;border-bottom:2px solid var(--rule);letter-spacing:0.04em;text-transform:uppercase;}
table.sum td{font-size:0.75rem;padding:0.5rem 0.6rem;border-bottom:1px solid var(--rule);}
table.sum tbody tr:last-child td{border-bottom:none;}
table.sum tr:hover td{background:var(--accent-bg);}
table.sum .hi{font-weight:700;color:var(--gold-ink);}
.chart-card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:1.1rem 1.2rem;margin-bottom:1.6rem;}
.chart-card h3{font-size:0.7rem;font-weight:700;color:var(--ink);margin-bottom:0.2rem;letter-spacing:0.08em;}
.chart-cap{font-size:0.6rem;color:var(--ink3);margin-bottom:0.8rem;line-height:1.6;}
canvas.trend{width:100%;height:220px;display:block;}
.note{font-size:0.7rem;color:var(--ink);padding:0.7rem 0.9rem;background:var(--gold-bg);border:1px solid rgba(200,165,90,0.4);border-left:3px solid var(--gold);border-radius:var(--r);margin-bottom:1.6rem;line-height:1.7;font-weight:500;text-wrap:pretty;}
.career-bar{margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.career-lb{width:10rem;text-align:right;font-size:0.7rem;color:var(--ink2);flex-shrink:0;}
.career-tr{flex:1;height:1.1rem;background:var(--rule);border-radius:3px;overflow:hidden;}
.career-fl{height:100%;background:var(--accent);border-radius:3px;opacity:.85;}
.career-vl{font-size:0.7rem;color:var(--ink2);min-width:2rem;font-variant-numeric:tabular-nums;}
.cmt-themed{margin-bottom:16px;}
.cmt-themed h4{font-size:0.65rem;font-weight:600;color:var(--ink3);margin-bottom:0.3rem;}
@media(max-width:640px){
  html{font-size:18px;}
  .tiles,.tiles.t4{grid-template-columns:1fr 1fr;}
  .tile-v{font-size:1.5rem;}
  .cmts{grid-template-columns:1fr;}
  .hbar-lb,.career-lb{width:7rem;font-size:0.6rem;}
  .tab{padding:0.5rem;font-size:0.65rem;}
}
@media(max-width:400px){
  .tiles,.tiles.t4{grid-template-columns:1fr;}
}
@media print{
  .tabs{display:none;}
  .pnl{display:block !important;page-break-inside:avoid;}
}
</style>

const SL=['不満','やや不満','普通','やや満足','満足'];
const SC=['c1','c2','c3','c4','c5'];

function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;}

function tiles(data){
  const g=h('div','tiles');
  const items=[];
  items.push({v:data.r,l:'回答数',s:data.n?`参加者 ${data.n}名`:null});
  items.push({v:data.sat.toFixed(2),l:'満足度',s:'MAX 5.00'});
  items.push({v:data.pct?data.pct+'%':'-',l:'回答率',s:null});
  if(data.nps!=null)items.push({v:data.nps.toFixed(2),l:'推奨度',s:'MAX 5.00'});
  if(items.length===4)g.classList.add('t4');
  items.forEach(t=>{
    const d=h('div','tile'+(t.l==='満足度'?' key':''));
    d.innerHTML=`<div class="tile-v">${t.v}</div><div class="tile-l">${t.l}</div>${t.s?`<div class="tile-sub">${t.s}</div>`:''}`;
    g.appendChild(d);
  });
  return g;
}

function satBar(dist,total){
  const sec=h('div','sec');
  sec.appendChild(h('div','sec-t','満足度分布'));
  const bar=h('div','sat-bar');
  for(let i=4;i>=0;i--){
    if(dist[i]===0)continue;
    const pct=(dist[i]/total*100);
    const seg=h('div',`sat-seg ${SC[i]}`);
    seg.style.width=pct+'%';
    seg.title=`${SL[i]}: ${dist[i]}件 (${pct.toFixed(1)}%)`;
    if(pct>12)seg.textContent=Math.round(pct)+'%';
    bar.appendChild(seg);
  }
  sec.appendChild(bar);
  const leg=h('div','sat-legend');
  for(let i=4;i>=0;i--){
    if(dist[i]===0)continue;
    const pct=(dist[i]/total*100).toFixed(1);
    const li=h('div','sat-li',`<span class="sat-dot" style="background:var(--s${i+1})"></span>${SL[i]} ${dist[i]}件`);
    leg.appendChild(li);
  }
  sec.appendChild(leg);
  return sec;
}

function hBars(title,data,maxVal,variant){
  const sec=h('div','sec'+(variant?' sec-'+variant:''));
  sec.appendChild(h('div','sec-t',title));
  const mx=maxVal||Math.max(...data.map(d=>d[1]));
  data.forEach(([lb,val])=>{
    const row=h('div','hbar');
    row.innerHTML=`<div class="hbar-lb">${lb}</div><div class="hbar-tr"><div class="hbar-fl" style="width:${val/mx*100}%"></div></div><div class="hbar-vl">${val}</div>`;
    sec.appendChild(row);
  });
  return sec;
}

function cmtSection(pos,imp){
  const sec=h('div','sec');
  sec.appendChild(h('div','sec-t','参加者の声'));
  const grid=h('div','cmts');
  grid.appendChild(cmtCol('嬉しいお声',pos,'p'));
  grid.appendChild(cmtCol('改善要望・テーマ候補',imp,'i'));
  sec.appendChild(grid);
  return sec;
}

function cmtCol(title,items,type){
  const col=h('div','cmt-col');
  col.innerHTML=`<h3><span class="cmt-dot ${type}"></span>${title} (${items.length})</h3>`;
  if(!items.length){col.appendChild(h('div','cmt-empty','なし'));return col;}
  const ul=h('ul','cmt-list');
  items.forEach(t=>{const li=h('li','cmt-item',t);ul.appendChild(li);});
  col.appendChild(ul);
  if(items.length>5){
    const btn=h('button','cmt-more',`全${items.length}件を表示`);
    btn.onclick=()=>{
      const open=ul.classList.toggle('open');
      btn.textContent=open?'閉じる':`全${items.length}件を表示`;
    };
    col.appendChild(btn);
  }
  return col;
}

function renderSurvey(s){
  const pnl=h('div','pnl');
  pnl.id='p-'+s.id;
  if(s.title||s.sub){pnl.appendChild(h('div','note',`<strong>${s.title||''}</strong>${s.sub?' <span style="opacity:.7">'+s.sub+'</span>':''} / ${s.lb} / 回答${s.r}件${s.n?' / 参加'+s.n+'名':''}`));}
  pnl.appendChild(tiles(s));
  pnl.appendChild(satBar(s.d,s.r));
  if(s.reasons)pnl.appendChild(hBars('参加理由',s.reasons));
  if(s.channels)pnl.appendChild(hBars('流入経路',s.channels,null,'gold'));
  pnl.appendChild(cmtSection(s.pos,s.imp));
  return pnl;
}

function renderOverview(){

  pnl.appendChild(t);

  const cc=h('div','chart-card');
  cc.innerHTML='<h3>満足度推移</h3><p class="chart-cap">縦軸は4.0〜5.0（0起点ではありません）。<br>オーカーの破線＝全'+S.length+'回の加重平均 '+avgSat+'。'+S[0].lb+'は加重平均を'+(S[0].sat-avgSat>0?'+':'')+(S[0].sat-avgSat).toFixed(2)+'上回っています。</p>';
  const cv=document.createElement('canvas');
  cv.className='trend';
  cc.appendChild(cv);
  pnl.appendChild(cc);

  const tw=h('div','tbl-wrap');
  let rows='';

    const latest=s===S[0];
    rows+=`<tr><td${latest?' class="hi"':''}>${s.lb}</td><td>${s.title||s.sub||''}</td><td>${s.sub||''}</td><td>${s.n||'-'}</td><td>${s.r}</td><td>${s.pct?s.pct+'%':'-'}</td><td${latest?' class="hi"':''}>${s.sat.toFixed(2)}</td></tr>`;
  });
  tw.innerHTML=`<table class="sum"><thead><tr><th>日付</th><th>テーマ</th><th>種別</th><th>参加者</th><th>回答</th><th>回答率</th><th>満足度</th></tr></thead><tbody>${rows}</tbody></table>`;
  pnl.appendChild(tw);
  return {pnl,canvas:cv};
}

function drawTrend(canvas){
  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  const W=rect.width, H=rect.height;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  const pts=[...S].reverse();
  const pad={t:30,r:20,b:36,l:40};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;

  const vals=pts.map(p=>p.sat);
  const yMin=4.0, yMax=5.0;
  const yRange=yMax-yMin;

  const toX=i=>pad.l+i/(pts.length-1)*pw;
  const toY=v=>pad.t+(1-(v-yMin)/yRange)*ph;

  const cs=getComputedStyle(document.documentElement);
  const gridC=cs.getPropertyValue('--rule').trim();
  const inkC=cs.getPropertyValue('--ink').trim();
  const ink2C=cs.getPropertyValue('--ink2').trim();
  const ink3C=cs.getPropertyValue('--ink3').trim();
  const accentC=cs.getPropertyValue('--accent').trim();
  const cardC=cs.getPropertyValue('--card').trim();

  ctx.strokeStyle=gridC;ctx.lineWidth=1;
  for(let v=4.0;v<=5.0;v+=0.2){
    const y=Math.round(toY(v))+0.5;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle=ink3C;ctx.font='11px system-ui,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(v.toFixed(1),pad.l-6,y);
  }

  const goldC=cs.getPropertyValue('--gold').trim();
  const goldInkC=cs.getPropertyValue('--gold-ink').trim();
  const rSum=pts.reduce((a,p)=>a+p.r,0);
  const wAvg=pts.reduce((a,p)=>a+p.sat*p.r,0)/rSum;
  const ay=Math.round(toY(wAvg))+0.5;
  ctx.save();
  ctx.setLineDash([5,4]);ctx.strokeStyle=goldC;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(pad.l,ay);ctx.lineTo(W-pad.r,ay);ctx.stroke();
  ctx.restore();

  ctx.strokeStyle=accentC;ctx.lineWidth=2;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();
  pts.forEach((p,i)=>{const x=toX(i),y=toY(p.sat);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();

  pts.forEach((p,i)=>{
    const x=toX(i),y=toY(p.sat);
    const isLast=(i===pts.length-1);
    const dotC=isLast?goldC:accentC;
    ctx.beginPath();ctx.arc(x,y,isLast?6:5,0,Math.PI*2);ctx.fillStyle=dotC;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=cardC;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle=dotC;ctx.fill();

    ctx.fillStyle=isLast?goldInkC:inkC;ctx.font='bold 12px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(p.sat.toFixed(2),x,y-10);
    if(pw/(pts.length-1)>=46){
      ctx.fillStyle=ink3C;ctx.font='10px system-ui,sans-serif';ctx.textBaseline='top';
      ctx.fillText('n='+p.r,x,y+10);
    }

    ctx.fillStyle=ink2C;ctx.font='11px system-ui,sans-serif';ctx.textBaseline='top';
    ctx.fillText(p.lb,x,H-pad.b+8);
  });
}

function init(){
  const app=document.getElementById('app');
  const wrap=h('div','wrap');

  const hdr=h('header','hdr');
  hdr.innerHTML='<h1>佐藤ゼミ アンケート結果</h1><p>SHIFT AI ライターゼミ / 全回分ダッシュボード</p>';
  wrap.appendChild(hdr);

  const nav=h('nav','tabs');
  nav.setAttribute('role','tablist');
  const tabData=[{id:'overview',lb:'推移'},...S.map(s=>({id:s.id,lb:s.lb})),{id:'20260319',lb:'3/19'}];
  tabData.forEach(t=>{
    const btn=h('button','tab',t.lb);
    btn.dataset.tab=t.id;
    btn.setAttribute('role','tab');
    btn.onclick=()=>activate(t.id);
    nav.appendChild(btn);
  });
  wrap.appendChild(nav);

  const main=h('main','');

  const ov=renderOverview();
  main.appendChild(ov.pnl);
  S.forEach(s=>main.appendChild(renderSurvey(s)));
  main.appendChild(renderInitial());

  wrap.appendChild(main);
  app.appendChild(wrap);

  activate('overview');

  requestAnimationFrame(()=>drawTrend(ov.canvas));
  let resizeTimer;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>drawTrend(ov.canvas),150);
  });

  const mo=new MutationObserver(()=>{
    if(document.querySelector('.pnl.act #p-overview, #p-overview.act'))drawTrend(ov.canvas);
  });
  mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}

function activate(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('act',t.dataset.tab===id));
  document.querySelectorAll('.pnl').forEach(p=>p.classList.toggle('act',p.id==='p-'+id));
  if(id==='overview'){
    const cv=document.querySelector('canvas.trend');
    if(cv)requestAnimationFrame(()=>drawTrend(cv));
  }
}

init();
</script>
